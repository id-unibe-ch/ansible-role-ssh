---
role_name_check: 1
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: ${MOLECULE_DISTRO:-ubuntu2404}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    extra_opts:
      - --cgroupns=host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
