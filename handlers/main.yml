---
# handlers file for ssh
#
- name: Restart Ubuntu SSH socket
  ansible.builtin.systemd:
    name: ssh.socket
    state: restarted
    daemon_reload: true
  listen: restart-sshd
  when: __ssh_manage_socket | bool

- name: Restart sshd service
  ansible.builtin.systemd:
    name: "{{ __ssh_service_name }}"
    state: restarted
  listen: restart-sshd
